# Portable evaluation settings from archived eval_q2_margins_ant; not training metadata.
use_shield: true
run_name: pretrained_ant
ckpt_base_dir: ./outputs/evaluation
load_checkpoint_epoch: null
use_wandb: false
wandb_project: q-barrier
name_postfix: velocity_test
allow_legacy_shield_aux: false
task_type: velocity
sample_actions: false
save_metrics: true
metrics_file_name: inner_episode_trends.npz
env_name: SafetyAntVelocity-v1
env_mode: sync
num_train_goals: 1
num_test_goals: 100
time_limit: 200
max_inner_episodes: 10
sticky_movement_multiplier: 1
lidar: false
replay_capacity: 100000
seed: 42
reward_multiplier: 1
cost_multiplier: 1
no_video: true
normalize_reward: true
shield_config:
  shield_alpha: 1.25
  shield_safety_margin: 0.0
  shield_fallback: policy
  shield_warmup_epochs: 0
  shield_critic_agg: max
  shield_filter_mode: soft
  shield_score_mode: barrier
  shield_log_margins: true
  shield_soft_beta: 1.0
  shield_critic_quantile: 0.75
  shield_continuous_num_samples: 8
  shield_continuous_enable_fast_path: true
  shield_continuous_mean_exit_margin: 0.0
  shield_continuous_stage1_num_samples: 3
  use_world_model_aux: true
  wm_hidden_dim: 256
  wm_nll_weight: 1.0
  wm_loss_weight: 1.0
  cbf_smoothness_weight: 0.0
  latent_distill_weight: 0.1
  rnd_loss_weight: 0.0
  epsilon_calib_weight: 0.05
  epsilon_calib_quantile: 0.95
  gamma_conjugacy_weight: 0.1
  cbf_collapse_weight: 0.1
  detach_structural_losses: true
constrained_env_config:
  train_radial_alpha: 0.0
  min_ctg: 0.0
  max_ctg: 5.0
constrained_agent_config:
  fixed_lagrangian_multiplier: 5.0
  lambda_lr: 3.0e-05
  lambda_init: 0.0
  lambda_upper_bound: null
  max_unused_fraction: 1000.0
max_seq_len: 2000
embedding_dim: 64
hidden_dim: 64
num_layers: 4
num_heads: 8
epochs: 1000
batch_size: 32
learning_rate: 0.0001
train_timesteps_per_epoch: ${max_seq_len}
train_batches_per_epoch: 1000
val_timesteps_per_epoch: ${eval:'${max_seq_len} * 10'}
mixed_precision: 'no'
start_learning_at_epoch: 0
val_interval: 10
ckpt_interval: 10
load_checkpoint_path: ./pretrained/ant.pt
save_gifs: false
